<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scroll reveal regression checks</title>
<link rel="stylesheet" href="../text-foil.css">
<link rel="stylesheet" href="../text-reveal.css">
<style>
  :root { --ink: #182030; }
  body { margin: 24px; max-width: 380px; color: var(--ink); font: 18px/1.6 Georgia,serif; }
  .stage-wrap { height: 0; }
  h1 { font-size: 32px; line-height: 1.1; }
  #results { font: 14px/1.5 system-ui; }
  .pass { color: #087454; } .fail { color: #b51e32; }
</style>
<h2 id="result">Running checks…</h2>
<ol id="results"></ol>
<div class="stage-wrap"></div>
<main>
  <div class="intro"><h1 class="foil-text">The Ikigai Mountain</h1></div>
  <p class="feels" id="first">A shimmering passage with enough words to wrap across several lines, while keeping every original English word readable and in the same place.</p>
  <p class="feels" id="second">Another passage for reduced motion.</p>
  <p class="carry" id="carry"><span>Carry this up</span> What would you love to make?</p>
</main>
<script src="text-reveal.setup.js"></script>
<script src="../text-reveal.js"></script>
<script src="text-reveal.test.js"></script>
</html>
